[package]
name = "ktt-api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web= "4.11.0"
hex = "0.4.3"
reqwest = { version = "0.12.22", features = ["json", "blocking"] }
serde = { version = "1.0.219", features = ["derive"] }
sha2 = "0.10.9"
spdlog-rs = "0.4.3"
zip = { version = "4.3.0", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
split-debuginfo = "packed"
strip = "symbols"
lto = true
panic = "unwind"
codegen-units = 1